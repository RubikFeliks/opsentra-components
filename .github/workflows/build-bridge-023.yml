name: Build clipboard bridge 0.2.3 Windows
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-bridge-023.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact reviewed public component sources
        shell: python
        run: |
          import base64, hashlib, io, zipfile
          data=base64.b64decode("")
          assert hashlib.sha256(data).hexdigest()=="4bc5667b2b62fc3b030968f9b30ac1e94aa076f0a3ed641ba35f1d130c9824c5"
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert all(not n.startswith('/') and '..' not in n.split('/') for n in archive.namelist())
              archive.extractall('.')
          open('bridge-0.2.3-build-sources.zip','wb').write(data)
      - uses: actions/setup-go@v5
        with:
          go-version-file: clipboard-bridge/go.mod
          cache: false
      - name: Go protocol and file tests
        working-directory: clipboard-bridge
        run: go test -race ./...
      - name: Compile Windows clipboard helper from current UTF-8 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local/helper | Out-Null
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /target:exe /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll /out:.local/helper/OpsentraClipboard.exe desktop-client/native/ClipboardWindows.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Windows clipboard Unicode pipe round-trip
        run: python scripts/test_windows_clipboard_helper.py --helper .local/helper/OpsentraClipboard.exe
      - name: Build standalone Windows package
        run: python scripts/build_standalone_bridge.py --target windows-amd64 --helper .local/helper/OpsentraClipboard.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Opsentra-Clipboard-Bridge-Windows-x64-0.2.3-tested
          path: |
            .local/standalone-bridge/*.zip
            .local/standalone-bridge/*.sha256
            bridge-0.2.3-build-sources.zip
